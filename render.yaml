# Infraestrutura como código: API e frontend no Render + PostgreSQL no Neon.
services:
  - type: web
    name: parky-fiap-diogo-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://parky-fiap-diogo-web.onrender.com
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: America/Sao_Paulo

  - type: web
    name: parky-fiap-diogo-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://parky-fiap-diogo-api.onrender.com
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
